services:

  # PostgreSQL (optional, тільки якщо потрібний для зберігання chunks)
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: leanctx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leanctx
      POSTGRES_PASSWORD: leanctx_pass
      POSTGRES_DB: leanctx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leanctx -d leanctx_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Redis (основний сторедж hot-state + skills)
  redis:
    image: redis:7-alpine
    container_name: leanctx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --save 60 1000
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  # MCP Bridge / FastAPI backend
  mcp_bridge:
    build:
      context: .
      dockerfile: Dockerfile.mcp_bridge
    container_name: leanctx-mcp-bridge
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MCP_BRIDGE_HOST: 0.0.0.0
      MCP_BRIDGE_PORT: 8080
      POSTGRES_DSN: postgresql://leanctx:leanctx_pass@postgres:5432/leanctx_db
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_DIM: 384
      CACHE_TTL_SECONDS: 600
      SESSION_TTL_SECONDS: 1800
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

  # LLM mock endpoint (FastAPI)
  llm_mock:
    build:
      context: .
      dockerfile: Dockerfile.llm_mock
    container_name: leanctx-llm-mock
    restart: unless-stopped
    ports:
      - "9000:9000"
    command: ["python", "test_llm.py"]

volumes:
  postgres_data:
  redis_data:
