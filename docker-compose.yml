
services:

  # ----------------------------
  # POSTGRES + PGVECTOR
  # Semantic Memory DB
  # ----------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: leanctx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leanctx
      POSTGRES_PASSWORD: leanctx_pass
      POSTGRES_DB: leanctx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leanctx -d leanctx_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ----------------------------
  # REDIS
  # Cache + session memory
  # ----------------------------
  redis:
    image: redis:7-alpine
    container_name: leanctx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --save 60 1000
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  # ----------------------------
  # NEO4J
  # Graph Memory (concept relations)
  # ----------------------------
  neo4j:
    image: neo4j:5.15
    container_name: leanctx-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/leanctx_pass
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # ----------------------------
  # MCP BRIDGE
  # FastAPI memory operating layer
  # ----------------------------
  mcp_bridge:
    build:
      context: .
      dockerfile: Dockerfile.mcp_bridge
    container_name: leanctx-mcp-bridge
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      MCP_BRIDGE_HOST: 0.0.0.0
      MCP_BRIDGE_PORT: 8080
      POSTGRES_DSN: postgresql://leanctx:leanctx_pass@postgres:5432/leanctx_db
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: leanctx_pass
      EMBEDDING_DIM: 384
      CACHE_TTL_SECONDS: 600
      SESSION_TTL_SECONDS: 1800
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
